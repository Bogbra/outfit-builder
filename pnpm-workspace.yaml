packages:
  - "apps/*"
  - "packages/*"
injectWorkspacePackages: true
overrides:
  # next@16.2.12 bundles a vulnerable postcss@8.4.31 (GHSA-r28c-9q8g-f849
  # path traversal, GHSA-qx2v-qp2m-jg93 XSS) — force the patched version.
  postcss: ">=8.5.18"
  # next@16.2.12 bundles sharp@0.34.5, whose vendored libvips has several
  # CVEs fixed in sharp 0.35.0 — force the patched version.
  sharp: ">=0.35.0"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
